<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A simple to-do list.">
    <title>To-do list</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="To-do list home">To-do list</a>
        <div class="topbar-right">
          <span class="today-label" id="today-label"></span>
          <button class="text-button hidden" id="logout-button" type="button">Sign out</button>
        </div>
      </header>

      <section class="auth-view" id="auth-view" aria-labelledby="auth-title">
        <div class="auth-copy">
          <h1 id="auth-title">Keep track of your tasks.</h1>
          <p class="intro">Sign in to manage your to-do list.</p>
        </div>
        <div class="auth-form-wrap">
          <div class="auth-tabs" role="tablist" aria-label="Account access">
            <button class="auth-tab is-selected" id="login-tab" type="button" role="tab" aria-selected="true">Sign in</button>
            <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false">Create account</button>
          </div>
          <form id="auth-form">
            <h2 id="form-heading">Welcome back</h2>
            <p class="form-caption" id="form-caption">Pick up where you left off.</p>
            <div class="registration-fields hidden" id="registration-fields">
              <div>
                <label for="first-name">First name</label>
                <input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="First name" maxlength="100">
              </div>
              <div>
                <label for="last-name">Last name</label>
                <input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Last name" maxlength="100">
              </div>
              <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" autocomplete="sex">
                  <option value="">Select gender</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                  <option value="non-binary">Non-binary</option>
                  <option value="prefer-not-to-say">Prefer not to say</option>
                </select>
              </div>
            </div>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8" maxlength="72">
            <p class="status-message" id="auth-message" role="status" aria-live="polite"></p>
            <button class="button button-primary auth-submit" id="auth-submit" type="submit">Sign in</button>
          </form>
        </div>
      </section>

      <section class="todo-view hidden" id="todo-view" aria-labelledby="greeting">
        <div class="workspace-heading">
          <div>
            <p id="workspace-date"></p>
            <h1 id="greeting">Your day, in good order.</h1>
            <p class="workspace-subtitle" id="welcome-copy">A clear list makes a little room for everything else.</p>
          </div>
          <div class="progress-stamp" aria-live="polite">
            <span class="progress-number" id="progress-number">0/0</span>
            <span class="progress-caption">done today</span>
          </div>
        </div>

        <form class="composer" id="todo-form">
          <div class="composer-main">
            <input id="todo-title" name="title" type="text" placeholder="What needs your attention?" maxlength="255" required autocomplete="off" aria-label="New task title">
            <button class="button button-primary add-button" type="submit">Add task</button>
          </div>
          <input id="todo-description" name="description" type="text" placeholder="Add a note (optional)" maxlength="10000" aria-label="Optional task note">
          <label class="due-date-label" for="todo-due-at">Due date and time</label>
          <input id="todo-due-at" name="dueAt" type="datetime-local" aria-label="Task due date and time">
        </form>
        <p class="status-message workspace-message" id="todo-message" role="status" aria-live="polite"></p>

        <div class="list-toolbar">
          <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
            <button class="filter-tab is-selected" type="button" data-filter="all" aria-pressed="true">All <span id="all-count">0</span></button>
            <button class="filter-tab" type="button" data-filter="active" aria-pressed="false">To do <span id="active-count">0</span></button>
            <button class="filter-tab" type="button" data-filter="completed" aria-pressed="false">Done <span id="completed-count">0</span></button>
          </div>
        </div>
        <ul class="todo-list" id="todo-list" aria-label="Todo list"></ul>
        <div class="empty-state" id="empty-state">
          <p id="empty-title">Nothing on the list yet.</p>
          <span id="empty-caption">Add a task above to get started.</span>
        </div>
        <footer class="workspace-footer"><span id="footer-count">0 open tasks</span></footer>
      </section>
    </main>
  </body>
</html>
